name: Publish iPhone PNG icon
on:
  push:
    paths:
      - '.github/workflows/publish-iphone-icon.yml'
      - 'assets/icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render iPhone icon PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 180 -h 180 assets/icon.svg -o assets/apple-touch-icon.png
          file assets/apple-touch-icon.png
      - name: Commit iPhone icon
        run: |
          if true; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/apple-touch-icon.png
            git diff --cached --quiet || (git commit -m 'Add iPhone Home Screen PNG icon' && git push)
          fi
