name: Refresh Tech Today
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Fetch publisher RSS feeds
        run: python3 update_news.py
      - name: Commit refreshed headlines
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'Refresh headlines'
            git push
          fi
