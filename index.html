<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tech Today"><link rel="manifest" href="manifest.webmanifest"><title>Tech Today</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#f5f5f7}*{box-sizing:border-box}body{margin:0;background:#000}header{position:sticky;top:0;background:#000e;border-bottom:1px solid #333;z-index:2}.wrap{max-width:760px;margin:auto;padding:16px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:26px;font-weight:800}.brand span{color:#ff453a}.status,.meta{font-size:12px;color:#aaa}.refresh{background:#f5f5f7;color:#111;border:0;border-radius:20px;padding:11px 14px;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:10px 0 0;overflow:visible}.tab{min-width:0;min-height:42px;border:1px solid #3b3b3f;border-radius:0;background:#17171a;color:#ddd;padding:8px 3px;font-size:12px;line-height:1.2;white-space:normal;text-align:center}.tab:first-child{border-top-left-radius:11px}.tab:nth-child(3){border-top-right-radius:11px}.tab:nth-child(4){border-bottom-left-radius:11px}.tab:last-child{border-bottom-right-radius:11px}.tab.active{background:#303037;color:white;border-bottom:3px solid #ff453a;font-weight:700}@media(min-width:620px){.tabs{grid-template-columns:repeat(6,minmax(0,1fr))}.tab{font-size:13px}.tab:first-child{border-radius:11px 0 0 11px}.tab:nth-child(3),.tab:nth-child(4){border-radius:0}.tab:last-child{border-radius:0 11px 11px 0}}main{min-height:70vh}.story{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid #282828;color:inherit;text-decoration:none}.story>div{flex:1;min-width:0}.story h3{font-size:19px;line-height:1.25;margin:6px 0}.story p{color:#bdbdc5;font-size:14px;line-height:1.5}.story img{width:100px;height:100px;object-fit:cover;border-radius:12px}.link{color:#93baff;font-size:12px}.notice{padding:24px 0;color:#bbb}.bottom{margin:24px 0 40px}</style></head><body><header><div class="wrap"><div class="top"><div><div class="brand">Tech <span>Today</span></div><div class="status" id="status">Checking news…</div></div><button class="refresh">↻ Refresh</button></div><nav class="tabs"><button class="tab active" data-category="all">For You</button><button class="tab" data-category="youtube">YouTube & Premium</button><button class="tab" data-category="ai">AI</button><button class="tab" data-category="apple">Apple</button><button class="tab" data-category="google">Google</button><button class="tab" data-category="other">More Tech</button></nav></div></header><main class="wrap"><h2 id="heading">Latest headlines</h2><p class="meta">Newest first · Original publisher links</p><div id="feed" aria-live="polite"></div><div class="bottom"><span class="meta" id="updated">Waiting for first update</span><button class="refresh">↻ Refresh</button></div></main><script>
let articles=[],category='all',lastFetch=0,busy=false;const feed=document.querySelector('#feed'),status=document.querySelector('#status');const labels={all:'Latest headlines',youtube:'YouTube & Premium',ai:'AI',apple:'Apple',google:'Google',other:'More Tech'};const url=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:null}catch{return null}};const fmt=s=>s?new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Unknown';
function render(){document.querySelector('#heading').textContent=labels[category];feed.replaceChildren();const rows=articles.filter(a=>category==='all'||a.category===category);if(!rows.length){const e=document.createElement('p');e.className='notice';e.textContent=articles.length?'No stories in this category yet.':'No headlines collected yet. Run the news collector after setup.';feed.append(e);return}for(const a of rows){if(!url(a.url))continue;const link=document.createElement('a');link.className='story';link.href=url(a.url);link.target='_blank';link.rel='noopener noreferrer';const body=document.createElement('div');const meta=document.createElement('div');meta.className='meta';meta.textContent=(a.source||'Publisher')+' · '+fmt(a.published);const title=document.createElement('h3');title.textContent=a.title;const desc=document.createElement('p');desc.textContent=a.summary||'';const original=document.createElement('span');original.className='link';original.textContent='Read original publisher ↗';body.append(meta,title,desc,original);link.append(body);if(url(a.image)){const img=document.createElement('img');img.src=url(a.image);img.loading='lazy';img.alt='';img.onerror=()=>img.remove();link.append(img)}feed.append(link)}}
async function refresh(){if(busy)return;busy=true;document.querySelectorAll('.refresh').forEach(b=>b.disabled=true);status.textContent='Checking for updates…';try{const response=await fetch('news.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const data=await response.json();articles=(data.articles||[]).filter(a=>a.title&&url(a.url)).sort((a,b)=>new Date(b.published)-new Date(a.published));const stamp=fmt(data.updated_at);status.textContent=articles.length+' articles · Updated '+stamp;document.querySelector('#updated').textContent='Feed updated '+stamp;lastFetch=Date.now();render()}catch(e){status.textContent='Unable to refresh · Try again';if(!articles.length){feed.textContent='News unavailable. Try Refresh again.'}}finally{busy=false;document.querySelectorAll('.refresh').forEach(b=>b.disabled=false)}}
document.querySelectorAll('.refresh').forEach(b=>b.addEventListener('click',refresh));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastFetch>15000)refresh()});window.addEventListener('pageshow',e=>{if(e.persisted)refresh()});refresh();
</script></body></html>
